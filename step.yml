title: Change value in file
summary: Changes a selected value in a targeted file.
description: |-
  This Step changes a selected value in a targeted file, for example, constants.

  ### Configuring the Step

  1. Set the **File path** in which you want to change a value.
  2. Set the **Current value** which needs to be changed.
  3. Set the **New value**.

  ### Troubleshooting
  Please make sure that your targeted file path is correct, existing and relative from the root folder.
  Please make sure that you set a correct **Current value** which exists in the targeted file. You must define this value.
  Please make sure that you define the New value.

  ### Related Steps
  - [Change Working Directory for subsequent Steps](https://www.bitrise.io/integrations/steps/change-workdir)

website: https://github.com/bitrise-steplib/steps-change-value
source_code_url: https://github.com/bitrise-steplib/steps-change-value
support_url: https://github.com/bitrise-steplib/steps-change-value/issues

type_tags:
- utility
toolkit:
  go:
    package_name: github.com/bitrise-steplib/steps-change-value

inputs:
- file:
  opts:
    title: File path
    summary: The target file path in which you want to change a value.
    description: Path to the file in which the value replacement will be performed. The path must be relative to the repository root.
    is_required: true
- old_value:
  opts:
    title: Current value
    summary: The current value which needs to be changed in the target file.
    description: The exact string to search for and replace in the target file. The step fails if this value is not found and Mark the Step as Failed if not found is enabled.
    is_required: true
- new_value:
  opts:
    title: New value
    summary: The new value you want to write to the target file.
    description: The string that replaces all occurrences of the current value in the target file.
    is_required: true
- show_file: "false"
  opts:
    title: Print file content before and after the value change
    description: When enabled, prints the full file content to the build log before and after the replacement.
    value_options:
    - "true"
    - "false"
- notfound_exit: "true"
  opts:
    title: Mark the Step as "Failed" if the selected value isn't found
    description: When enabled, the step fails if the current value is not found in the target file. Disable this to allow the step to succeed even if no replacement was made.
    value_options:
    - "true"
    - "false"
- use_sudo: "true"
  opts:
    title: Use sudo when elevated permissions are required
    description: |-
      When enabled, the step retries reading and writing the target file with `sudo` if it hits a permission error.

      This is required on stacks where the step runs as the non-root user and the target file is owned by `root`. Disable this if `sudo` is unavailable in your environment or you want permission errors to fail the step directly.
    value_options:
    - "true"
    - "false"
